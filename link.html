const NAMES={2:"挥手噜噜",4:"眨眼噜噜",32:"爱心噜噜",64:"花花噜噜",128:"画家噜噜",256:"大厨噜噜",512:"太空噜噜",2048:"国王噜噜"};
const ROWS=6,COLS=6,TYPES=[2,4,32,64,128,256,512,2048];
function mode(level){return ['固定','向左','向右','向上','向下'][Math.floor((level-1)/10)%5];}
function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function route(board,a,b,ignoreType=false){
 if(a===b||!board[a]||!board[b]||(!ignoreType&&board[a]!==board[b]))return null;
 const start=[Math.floor(a/COLS)+1,a%COLS+1],end=[Math.floor(b/COLS)+1,b%COLS+1];
 const dirs=[[-1,0],[1,0],[0,-1],[0,1]],queue=[{r:start[0],c:start[1],d:-1,t:0,p:[start]}],seen=new Map();
 for(let q=0;q<queue.length;q++){
  const n=queue[q];
  for(let d=0;d<4;d++){
   const r=n.r+dirs[d][0],c=n.c+dirs[d][1],t=n.t+(n.d!==-1&&n.d!==d?1:0);
   if(t>2||r<0||r>ROWS+1||c<0||c>COLS+1)continue;
   const target=r===end[0]&&c===end[1];
   if(!target&&r>0&&r<=ROWS&&c>0&&c<=COLS&&board[(r-1)*COLS+c-1])continue;
   const key=r+','+c+','+d;
   if((seen.get(key)??3)<=t)continue;
   seen.set(key,t);const p=[...n.p,[r,c]];
   if(target)return p;
   queue.push({r,c,d,t,p});
  }
 }
 return null;
}
function findPair(board){for(let a=0;a<36;a++)if(board[a])for(let b=a+1;b<36;b++)if(board[a]===board[b]){const p=route(board,a,b);if(p)return {a,b,p};}return null;}
function rearrange(board){
 const slots=board.map((v,i)=>v?i:-1).filter(i=>i>=0);if(!slots.length)return [...board];
 let result=[...board];const values=slots.map(i=>board[i]);
 for(let n=0;n<30;n++){const next=shuffled(values);slots.forEach((i,k)=>result[i]=next[k]);if(findPair(result))return result;}
 // Place a matching pair at a geometrically connectable pair of occupied positions.
 for(let x=0;x<slots.length;x++)for(let y=x+1;y<slots.length;y++){
  const a=slots[x],b=slots[y];if(!route(result,a,b,true))continue;
  const other=slots.find(i=>i!==a&&result[i]===result[a]);
  if(other!==undefined){[result[b],result[other]]=[result[other],result[b]];return result;}
 }
 throw Error('无法重新排列棋盘');
}
function compact(board,direction){
 const next=Array(36).fill(0);
 if(direction==='固定')return [...board];
 for(let line=0;line<6;line++){
  const ids=Array.from({length:6},(_,i)=>direction==='向左'?line*6+i:direction==='向右'?line*6+5-i:direction==='向上'?i*6+line:(5-i)*6+line);
  const values=ids.map(i=>board[i]).filter(Boolean);values.forEach((v,i)=>next[ids[i]]=v);
 }
 return next;
}
function newBoard(){return rearrange(shuffled(Array.from({length:18},(_,i)=>[TYPES[i%TYPES.length],TYPES[i%TYPES.length]]).flat()));}
function validSave(s){return s&&Number.isSafeInteger(s.level)&&s.level>0&&Array.isArray(s.board)&&s.board.length===36&&s.board.every(v=>v===0||TYPES.includes(v))&&TYPES.every(v=>s.board.filter(x=>x===v).length%2===0);}

const $=id=>document.getElementById(id),KEY='lulu-link-v1';
let level=1,board=newBoard(),selected=null,busy=false,timer=null;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(validSave(saved)){level=saved.level;board=saved.board;}}catch{}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({level,board}));$('save').textContent='进度自动保存在此浏览器';}catch{$('save').textContent='当前浏览器无法保存进度，请保持页面打开';}}
function say(text){$('message').textContent=text;}
function ensure(){if(board.some(Boolean)&&!findPair(board)){board=rearrange(board);say('没有可连接的配对，已自动重排。');}}
function render(){
 $('level').textContent=level;$('mode').textContent=mode(level);$('remaining').textContent=board.filter(Boolean).length/2;
 $('range').textContent=`第 ${Math.floor((level-1)/10)*10+1}～${Math.floor((level-1)/10)*10+10} 关 · ${mode(level)==='固定'?'方块位置固定':`消除后${mode(level)}靠拢`}`;
 $('board').replaceChildren();
 board.forEach((value,i)=>{const b=document.createElement('button');b.type='button';b.className='tile'+(!value?' empty':'')+(i===selected?' selected':'');b.disabled=!value||busy;b.setAttribute('aria-label',value?`第${Math.floor(i/6)+1}行第${i%6+1}列，${NAMES[value]}`:'空格');if(value){const img=document.createElement('img');img.src=IMAGES[value];img.alt='';img.draggable=false;b.append(img);}b.onclick=()=>pick(i);$('board').append(b);});
 const won=!board.some(Boolean);$('win').hidden=!won;$('win-title').textContent=`第 ${level} 关完成！`;$('next-label').textContent=`下一关：${mode(level+1)}${mode(level+1)==='固定'?'模式':'靠拢'}`;
 $('hint').disabled=busy||won;$('shuffle').disabled=busy||won;
}
function clearLine(){$('line').replaceChildren();}
function draw(p){const poly=document.createElementNS('http://www.w3.org/2000/svg','polyline');poly.setAttribute('points',p.map(([r,c])=>`${c*100+50},${r*100+50}`).join(' '));$('line').append(poly);}
function pick(i){
 if(busy||!board[i])return;
 if(selected===null){selected=i;say('再选一个相同的噜噜。');render();return;}
 if(selected===i){selected=null;render();return;}
 const a=selected,p=route(board,a,i);
 if(!p){selected=i;say(board[a]===board[i]?'这两个暂时连不上，换一条路线试试。':'要选择两个相同的噜噜。');render();return;}
 selected=null;busy=true;render();draw(p);say('连接成功！');
 timer=setTimeout(()=>{clearLine();board[a]=0;board[i]=0;board=compact(board,mode(level));busy=false;ensure();persist();render();if(!board.some(Boolean)){say('全部消除！可以进入下一关。');$('next').focus();}},300);
}
$('hint').onclick=()=>{if(busy)return;const pair=findPair(board);if(!pair)return;selected=null;render();$('board').children[pair.a].classList.add('hinted');$('board').children[pair.b].classList.add('hinted');say('这两个发光的噜噜可以连接。');};
$('shuffle').onclick=()=>{if(busy)return;selected=null;board=rearrange(board);persist();render();say('已重新排列，继续找找看。');};
$('next').onclick=()=>{if(busy||board.some(Boolean))return;level++;board=newBoard();selected=null;persist();render();say('新的一关，慢慢来。');};
$('restart').onclick=()=>{if(!confirm('重新开始当前关？已完成的关卡会保留。'))return;clearTimeout(timer);clearLine();busy=false;selected=null;board=newBoard();persist();render();say('当前关已重新开始。');};
$('board').addEventListener('keydown',e=>{const all=[...$('board').children],i=all.indexOf(document.activeElement);const offset={ArrowLeft:-1,ArrowRight:1,ArrowUp:-6,ArrowDown:6}[e.key];if(i<0||!offset)return;e.preventDefault();for(let j=i+offset;j>=0&&j<36;j+=offset)if(!all[j].disabled){all[j].focus();break;}});
ensure();render();persist();
</script></body></html>
