<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>噜噜小游戏</title>
<meta name="description" content="选择噜噜翻翻乐、2048、连连看、跳跳乐或泡泡龙，开始一场轻松的小游戏。">
<style>
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:#fffaf4;color:#533e2e;font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}main{width:min(100% - 40px,460px);margin:clamp(50px,14vh,130px) auto 36px}header{margin-bottom:30px}h1{margin:0;font-size:32px;letter-spacing:-1px;font-weight:800}h1 span{color:#bc6029}header p{margin:8px 0 0;color:#94765f;font-size:15px}.games{display:grid;gap:16px}.game{display:flex;align-items:center;gap:18px;min-height:128px;padding:22px;color:inherit;text-decoration:none;border:1px solid #e8d7c3;border-radius:18px;background:#fffdf9;box-shadow:0 3px 0 #eddfcf;transition:transform .18s,box-shadow .18s,border-color .18s}.game:hover{transform:translateY(-3px);border-color:#d2ad81;box-shadow:0 6px 0 #eddfcf}.game:active{transform:translateY(0)}.game:focus-visible{outline:3px solid #537f9b;outline-offset:5px}.icon{width:66px;height:66px;flex-shrink:0;border-radius:16px;display:grid;place-items:center;background:#f9e4c8;color:#a85a25}.memory .icon{background:#e5eddf;color:#5d7950}.icon svg{width:42px;height:42px}.tile{font-size:24px;font-weight:850;letter-spacing:-1px}.text{flex:1;min-width:0}h2{font-size:20px;margin:0 0 4px}.text p{font-size:14px;color:#91745e;margin:0}.arrow{font-size:23px;color:#a48970}footer{text-align:center;margin-top:32px;font-size:13px;color:#a38b76}@media(max-width:370px){main{width:calc(100% - 28px)}.game{padding:18px 15px;gap:13px}.icon{width:55px;height:55px}h2{font-size:18px}.text p{font-size:13px}}@media(prefers-reduced-motion:reduce){.game{transition:none}}
.link-game .icon{background:#e0eaf1;color:#557c94}
.jump-game .icon{background:#f5ddcd;color:#aa704c}.bubble-game .icon{background:#e9dff1;color:#9473aa}main{margin-top:clamp(28px,6vh,60px)}
.greeting{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:144px;margin-bottom:22px}.greeting>div{min-width:0}.greeting canvas{display:block;width:144px;height:144px;flex:0 0 144px;pointer-events:none}@media(max-width:420px){.greeting{min-height:120px;gap:8px}.greeting canvas{width:120px;height:120px;flex-basis:120px}.greeting h1{font-size:28px}}@media(max-width:340px){.greeting canvas{width:96px;height:110px;flex-basis:96px}.greeting h1{font-size:25px}.greeting p{font-size:14px}}

/* Larger greeting character, leaning toward the text while keeping links clear. */
.greeting{position:relative;min-height:206px;margin-bottom:16px;gap:0}
.greeting>div{position:relative;z-index:1;flex:0 0 54%;pointer-events:none}
.greeting canvas{width:226px;height:226px;flex:0 0 226px;margin-left:-28px;margin-right:-12px;transform:rotate(-5deg) translateY(9px);transform-origin:center bottom}
@media(max-width:420px){.greeting{min-height:180px;gap:0}.greeting>div{flex-basis:55%}.greeting canvas{width:190px;height:190px;flex-basis:190px;margin-left:-35px;margin-right:-10px}.greeting h1{font-size:28px}}
@media(max-width:340px){.greeting{min-height:164px}.greeting canvas{width:168px;height:168px;flex-basis:168px;margin-left:-30px;margin-right:-8px}.greeting h1{font-size:25px}}

<main>
<header class="greeting"><div><h1><span>噜噜</span>小游戏</h1><p>早上中午晚上好！</p></div><canvas id="greeting-lulu" width="288" height="288" role="img" aria-label="和你打招呼的噜噜"></canvas></header>
<nav class="games" aria-label="选择游戏">
<a class="game memory" href="./memory.html">
<span class="icon" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><rect x="5" y="8" width="24" height="32" rx="5" transform="rotate(-10 5 8)" stroke="currentColor" stroke-width="2"/><rect x="20" y="7" width="24" height="33" rx="5" fill="#e5eddf" stroke="currentColor" stroke-width="2"/><path d="M27 24l4 4 7-9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<div class="text"><h2>噜噜翻翻乐</h2><p>翻开卡片，找到一样的噜噜。</p></div><span class="arrow" aria-hidden="true">→</span>

<a class="game" href="./2048.html">

</a>
<a class="game link-game" href="./link.html">
<span class="icon" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><rect x="3" y="7" width="14" height="17" rx="4" stroke="currentColor" stroke-width="2"/><rect x="31" y="7" width="14" height="17" rx="4" stroke="currentColor" stroke-width="2"/><path d="M10 25v13h28V25" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<div class="text"><h2>噜噜连连看</h2><p>连起相同的噜噜，一关接一关。</p></div><span class="arrow" aria-hidden="true">→</span>
</a>
<a class="game jump-game" href="./jump.html"><span class="icon" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="M7 36h11V25h11V14h12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 22L29 5m-11 0h11v11" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div class="text"><h2>噜噜跳跳乐</h2><p>跳过障碍，吃橘子，跑得更远。</p></div><span class="arrow" aria-hidden="true">→</span></a>

</nav>
<footer>休息一下，和噜噜玩一会儿。<br>其他噜噜小游戏尽请期待</footer>
