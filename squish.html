const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),speech=document.getElementById('speech');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const img=new Image();let W=400,H=500,box={x:0,y:0,w:1,h:1},ready=false,hold=null,last=0,frameId=0,pulseUntil=0,muted=false,audioCtx=null,reactUntil=0,reactions=0;
let releasedUntil=0,lastExpression='laugh';const expressionImages={};for(const [name,src] of Object.entries(EXPRESSIONS)){const face=new Image();face.src=src;expressionImages[name]=face;}
function expressionName(t){if(hold||pulseUntil)return Math.hypot(target.x,target.y)>13?'surprise':'laugh';return t<releasedUntil?lastExpression:'idle'}
const body={x:0,y:0,s:0,vx:0,vy:0,vs:0},target={x:0,y:0,s:0};
try{muted=localStorage.getItem('lulu-squish-muted')==='1'}catch{}
function soundLabel(){const b=document.getElementById('sound');b.textContent=muted?'♪ 音效关':'♪ 音效开';b.setAttribute('aria-pressed',String(!muted))}soundLabel();
function tone(release=false){if(muted)return;try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume().catch(()=>{});const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(release?310:220,t);o.frequency.exponentialRampToValueAtTime(release?140:90,t+.17);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.12,t+.025);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.22)}catch{}}
function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);if(ready){const scale=Math.min((W-65)/img.width,(H-42)/img.height);box={x:(W-img.width*scale)/2,y:H-img.height*scale-10,w:img.width*scale,h:img.height*scale}}reset(false)}
function say(text){speech.textContent=text;reactUntil=performance.now()+3200}
function reaction(){const lines=['哎呀，好痒呀！','谁在捏我呀！','噗叽——弹回来啦！','嘿嘿，被我发现了！','小橘子也跟着晃啦～'];say(lines[reactions++%lines.length])}
function reset(message=true){hold=null;pulseUntil=0;releasedUntil=0;Object.keys(body).forEach(k=>body[k]=0);target.x=target.y=target.s=0;if(message)say('呼～一起歇一会儿。')}
function local(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function hits(p){const u=(p.x-box.x)/box.w,v=(p.y-box.y)/box.h;return ready&&u>.27&&u<.81&&v>.61&&v<.85}
function press(e){if(e.isPrimary===false||e.button>0||hold)return;const p=local(e);if(!hits(p)){say('捏捏橙色小短裤试试～');return}e.preventDefault();canvas.setPointerCapture(e.pointerId);hold={id:e.pointerId,...p};target.s=1;pulseUntil=0;tone();reaction()}
function drag(e){if(!hold||e.pointerId!==hold.id)return;const p=local(e);target.x=Math.max(-32,Math.min(32,(p.x-hold.x)*.55));target.y=Math.max(-18,Math.min(18,(p.y-hold.y)*.4));}
function release(e){if(!hold||e.pointerId!==hold.id)return;lastExpression=expressionName(performance.now());releasedUntil=performance.now()+650;hold=null;target.x=target.y=target.s=0;tone(true)}
canvas.addEventListener('pointerdown',press);canvas.addEventListener('pointermove',drag);canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',()=>reset(false));canvas.addEventListener('lostpointercapture',e=>{if(hold?.id===e.pointerId)reset(false)});
document.getElementById('squeeze').onclick=()=>{if(!ready)return;hold=null;target.x=(reactions%2?1:-1)*16;target.y=-4;target.s=1;pulseUntil=performance.now()+230;tone();reaction()};
document.getElementById('rest').onclick=()=>reset();document.getElementById('sound').onclick=()=>{muted=!muted;soundLabel();try{localStorage.setItem('lulu-squish-muted',muted?'1':'0')}catch{}if(muted)audioCtx?.suspend();else tone()};
function simulate(dt){for(const k of ['x','y','s']){const v='v'+k;body[v]+=(target[k]-body[k])*210*dt;body[v]*=Math.exp(-(reduced?28:12)*dt);body[k]+=body[v]*dt}body.s=Math.max(-.45,Math.min(1.3,body.s))}
function render(t){ctx.clearRect(0,0,W,H);if(!ready)return;ctx.fillStyle='#b69d7130';ctx.beginPath();ctx.ellipse(W/2,H-12,box.w*.24,8,0,0,Math.PI*2);ctx.fill();const bob=reduced?0:Math.sin(t/900)*1.2;const step=3;const chosen=expressionImages[expressionName(t)];const sprite=chosen?.width?chosen:img;
for(let y=0;y<img.height;y+=step){const v=y/img.height,envelope=Math.exp(-Math.pow((v-.747)/.098,2)),scale=1-body.s*.095*envelope;const sw=box.w*scale;const dx=body.x*envelope,dy=body.y*envelope;ctx.drawImage(sprite,0,y/img.height*sprite.height,sprite.width,Math.min(step,img.height-y)/img.height*sprite.height,box.x+(box.w-sw)/2+dx,box.y+y/img.height*box.h+dy+bob,sw,step/img.height*box.h+1)}
if(hold){ctx.strokeStyle='#fffaf0aa';ctx.lineWidth=2;ctx.beginPath();ctx.arc(hold.x+target.x,hold.y+target.y,12,Math.PI*.2,Math.PI*.8);ctx.stroke()}}
function tick(t){const dt=Math.min((t-last)/1000||.016,.032);last=t;if(pulseUntil&&t>pulseUntil){lastExpression=expressionName(t);releasedUntil=t+650;pulseUntil=0;target.x=target.y=target.s=0;tone(true)}simulate(dt);if(reactUntil&&t>reactUntil){reactUntil=0;speech.textContent='慢慢来，我又不会跑掉。'}render(t);frameId=requestAnimationFrame(tick)}
window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{reset(false);if(document.hidden){cancelAnimationFrame(frameId);audioCtx?.suspend()}else{last=performance.now();frameId=requestAnimationFrame(tick)}});window.addEventListener('blur',()=>reset(false));
img.onload=()=>{ready=true;resize();document.getElementById('loading').hidden=true;frameId=requestAnimationFrame(tick)};img.onerror=()=>{document.getElementById('loading').textContent='噜噜没有加载成功，请刷新再试。'};img.src=LULU;resize();

</script></body></html>
