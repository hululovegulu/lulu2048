/* Gentle level colors: distinct frames and number bands, original image colors preserved. */
.cell.occupied {
  background:var(--tile-bg);
  border:1px solid var(--tile-border);
  box-shadow:0 3px 0 var(--tile-border);
}
.cell.occupied img {
  position:absolute;top:4px;left:4px;
  width:calc(100% - 8px);height:calc(100% - 28px);
  margin:0;object-fit:contain;
  background:#fff8ed;border-radius:9px;
}
.cell.occupied .tile-number {
  left:0;right:0;bottom:1px;
  padding:1px 4px;min-width:0;
  text-align:center;line-height:1.2;
  color:var(--tile-ink);background:transparent;
  box-shadow:none;border-radius:0;font-size:18px;
}
.level-2{--tile-bg:#f5e6ce;--tile-border:#dfc9a8;--tile-ink:#765637;}
.level-4{--tile-bg:#f5dac5;--tile-border:#ddb69a;--tile-ink:#805136;}
.level-8{--tile-bg:#f1ced0;--tile-border:#d7a9ae;--tile-ink:#824951;}
.level-16{--tile-bg:#ead4df;--tile-border:#cdb0c0;--tile-ink:#765068;}
.level-32{--tile-bg:#ddd5eb;--tile-border:#bcb0d0;--tile-ink:#635078;}
.level-64{--tile-bg:#d2deed;--tile-border:#a8bfd5;--tile-ink:#48637f;}
.level-128{--tile-bg:#cee6e8;--tile-border:#a1c8cd;--tile-ink:#3f6b73;}
.level-256{--tile-bg:#d2e5d8;--tile-border:#a7c7b2;--tile-ink:#456b53;}
.level-512{--tile-bg:#e0e8ca;--tile-border:#bdcba3;--tile-ink:#606e40;}
.level-1024{--tile-bg:#efdfb9;--tile-border:#d2bb85;--tile-ink:#7d632d;}
.level-2048{--tile-bg:#f4cc91;--tile-border:#d9a85d;--tile-ink:#805217;}
@media(max-width:680px){
  .cell.occupied img{top:3px;left:3px;width:calc(100% - 6px);height:calc(100% - 24px);border-radius:7px}
  .cell.occupied .tile-number{font-size:16px;bottom:1px}
}
