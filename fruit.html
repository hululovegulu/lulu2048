const FRUITS=[{emoji:'🍊',color:'#f59a28'},{emoji:'🍉',color:'#ec6e78'},{emoji:'🍓',color:'#e95265'},{emoji:'🍋',color:'#e9c343'},{emoji:'🥝',color:'#91b665'}];
function fresh(){return {phase:'ready',time:60,score:0,bestCombo:0,cut:0,missed:0,items:[],effects:[],labels:[],trail:[],spawnIn:.3,frenzy:0,reaction:'normal',reactionFor:0,nextId:1,stroke:0,combo:0,comboBlocked:false};}
function segmentDistance(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,d=dx*dx+dy*dy;const t=d?Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/d)):0;return Math.hypot(px-ax-t*dx,py-ay-t*dy);}
function beginStroke(s){s.stroke++;s.combo=0;s.comboBlocked=false;}
function react(s,mood){s.reaction=mood;s.reactionFor=1.8;}
function toss(s,random=Math.random){
 const frenzy=s.frenzy>0,count=frenzy?2:2+Math.floor(random()*2);
 for(let i=0;i<count;i++){
  const x=55+random()*280,kind=!frenzy&&random()<.13?'bomb':!frenzy&&random()<.065?'gold':'fruit';
  s.items.push({id:s.nextId++,x,y:585+i*13,vx:(195-x)*(.35+random()*.3)+(random()-.5)*45,vy:-690-random()*100,r:kind==='gold'?28:25,kind,fruit:Math.floor(random()*FRUITS.length),angle:random()*2,spin:(random()-.5)*3,cut:false});
 }
}
function slice(s,a,b,random=Math.random){
 if(s.phase!=='running'||Math.hypot(b.x-a.x,b.y-a.y)<2)return;
 for(const f of s.items){
  if(f.cut||segmentDistance(f.x,f.y,a.x,a.y,b.x,b.y)>f.r+3)continue;
  f.cut=true;
  if(f.kind==='bomb'){s.score=Math.max(0,s.score-30);s.combo=0;s.comboBlocked=true;react(s,'oops');s.labels.push({x:f.x,y:f.y,text:'−30',life:1,color:'#806b9c'});}
  else{
   s.cut++;s.combo++;s.bestCombo=Math.max(s.bestCombo,s.combo);
   const bonus=!s.comboBlocked&&s.combo>=3?5*s.combo:0;
   s.score+=(f.kind==='gold'?30:10)+bonus;
   if(f.kind==='gold'){s.frenzy=6;s.spawnIn=.1;react(s,'party');s.labels.push({x:f.x,y:f.y,text:'水果雨！',life:1.3,color:'#a77815'});}
   else if(s.combo>=3&&!s.comboBlocked){react(s,'cheer');s.labels.push({x:f.x,y:f.y,text:`${s.combo} 连击 +${bonus}`,life:1,color:'#bc5f26'});}
   else react(s,'happy');
   for(const side of [-1,1])s.effects.push({kind:'half',x:f.x,y:f.y,vx:side*90,vy:-80,life:.7,angle:f.angle,side,fruit:f.fruit,gold:f.kind==='gold'});
  }
  for(let i=0;i<9;i++)s.effects.push({kind:'drop',x:f.x,y:f.y,vx:(random()-.5)*240,vy:-random()*220,life:.55,color:f.kind==='bomb'?'#a79db6':f.kind==='gold'?'#eac054':FRUITS[f.fruit].color,r:2+random()*4});
 }
}
function advance(s,dt,random=Math.random){
 if(s.phase!=='running')return;
 s.time=Math.max(0,s.time-dt);s.frenzy=Math.max(0,s.frenzy-dt);s.reactionFor=Math.max(0,s.reactionFor-dt);if(!s.reactionFor)s.reaction='normal';
 if(s.time<=0){s.phase='over';return;}
 s.spawnIn-=dt;if(s.spawnIn<=0){toss(s,random);s.spawnIn=s.frenzy>0?.26:Math.max(.62,1.1-(60-s.time)*.006);}
 for(const f of s.items){f.vy+=900*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.angle+=f.spin*dt;if(!f.cut&&f.y>640&&f.vy>0){f.cut=true;if(f.kind!=='bomb'){s.missed++;if(s.reaction==='normal')react(s,'miss');}}}
 s.items=s.items.filter(f=>!f.cut&&f.y<660);
 for(const e of s.effects){e.life-=dt;e.vy+=600*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.kind==='half')e.angle+=e.side*dt*3;}
 s.effects=s.effects.filter(e=>e.life>0);
 for(const l of s.labels){l.life-=dt;l.y-=35*dt;}s.labels=s.labels.filter(l=>l.life>0);
 for(const t of s.trail)t.life-=dt;s.trail=s.trail.filter(t=>t.life>0);
}

const $=id=>document.getElementById(id),cv=$('game'),ctx=cv.getContext('2d'),mascot=$('mascot'),mctx=mascot.getContext('2d');
const portraits=PORTRAITS.map(src=>{const i=new Image();i.src=src;return i;});
let state=fresh(),pointer=null,lastPoint=null,last=0,best=0;
let backgroundIndex=-1;
function chooseBackground(random=Math.random){backgroundIndex=Math.floor(random()*BACKGROUNDS.length);document.querySelector('.stage').style.backgroundImage='url("'+BACKGROUNDS[backgroundIndex]+'")';}
chooseBackground();
try{best=Number(localStorage.getItem('lulu-fruit-best'))||0;}catch{}
$('best').textContent=best;
const phrases={normal:'准备好，橘子要来啦！',happy:'切得漂亮！',cheer:'哇！这一刀好厉害！',party:'幸运橘子！水果雨来啦！',oops:'哎呀，躲开紫色捣蛋球！',miss:'没关系，下一个接着来。'};
function sync(){
 $('time').textContent=Math.ceil(state.time);$('score').textContent=state.score;$('combo').textContent=state.bestCombo;$('rain').hidden=state.frenzy<=0;$('pause').disabled=state.phase==='ready'||state.phase==='over';$('pause').textContent=state.phase==='paused'?'继续':'暂停';
 $('overlay').hidden=state.phase==='running';
 if(state.phase==='ready'){$('title').textContent='噜噜水果派对';$('desc').textContent='手指划过水果，连切三个有奖励。避开紫色捣蛋球！';$('start').textContent='开始 60 秒挑战';$('result').hidden=true;}
 if(state.phase==='paused'){$('title').textContent='歇一会儿';$('desc').textContent='准备好了就继续，计时已暂停。';$('start').textContent='继续切水果';$('result').hidden=true;}
 if(state.phase==='over'){$('title').textContent='今天也收获满满！';$('desc').textContent=`切开 ${state.cut} 个水果 · 最佳 ${state.bestCombo} 连击`;$('result').hidden=false;$('result').textContent=`${state.score} 分`;$('start').textContent='再玩一局';if(state.score>best){best=state.score;try{localStorage.setItem('lulu-fruit-best',String(best));}catch{}}$('best').textContent=best;}
 const speech=state.phase==='over'?'送你一颗开心的小橘子！':phrases[state.reaction];if($('speech').textContent!==speech)$('speech').textContent=speech;
}
function start(){if(state.phase==='paused'){state.phase='running';}else{state=fresh();state.phase='running';chooseBackground();}pointer=null;lastPoint=null;last=performance.now();sync();}
function pause(){if(state.phase==='running'){state.phase='paused';pointer=null;lastPoint=null;state.trail=[];sync();}else if(state.phase==='paused')start();}
$('start').onclick=start;$('pause').onclick=pause;
function point(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*390/r.width,y:(e.clientY-r.top)*600/r.height};}
cv.addEventListener('pointerdown',e=>{if(state.phase!=='running'||pointer!==null)return;e.preventDefault();pointer=e.pointerId;cv.setPointerCapture(pointer);lastPoint=point(e);beginStroke(state);state.trail.push({...lastPoint,life:.18,stroke:state.stroke});});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==pointer||!lastPoint||state.phase!=='running')return;e.preventDefault();const samples=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of samples.length?samples:[e]){const p=point(ev);slice(state,lastPoint,p);state.trail.push({...p,life:.18,stroke:state.stroke});lastPoint=p;}});
function end(e){if(e.pointerId!==pointer)return;if(state.phase==='running'&&lastPoint&&e.type==='pointerup')slice(state,lastPoint,point(e));pointer=null;lastPoint=null;}
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('lostpointercapture',end);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.phase==='running')pause();});window.addEventListener('blur',()=>{if(state.phase==='running')pause();});
function fruit(f){
 ctx.save();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.translate(f.x,f.y);ctx.rotate(f.angle||0);
 ctx.shadowColor='rgba(41,24,9,.65)';ctx.shadowBlur=12;ctx.shadowOffsetY=4;
 ctx.fillStyle=f.kind==='gold'?'#ffe18a':'#fff8e8';ctx.strokeStyle='#ffffff';ctx.lineWidth=3;
 ctx.beginPath();ctx.arc(0,0,28,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.shadowOffsetY=0;ctx.shadowBlur=f.kind==='gold'?20:0;ctx.shadowColor='#ffb900';
 ctx.fillStyle='#ffffff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='51px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
 ctx.fillText(f.kind==='gold'?'🍊':FRUITS[f.fruit].emoji,0,1);
 if(f.kind==='gold'){ctx.shadowBlur=0;ctx.font='bold 21px sans-serif';ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.strokeText('✦',22,-24);ctx.fillStyle='#c57c00';ctx.fillText('✦',22,-24);}ctx.restore();
}
function bomb(f){
 ctx.save();ctx.globalAlpha=1;ctx.translate(f.x,f.y);ctx.rotate(f.angle);ctx.shadowColor='rgba(25,12,44,.6)';ctx.shadowBlur=12;ctx.shadowOffsetY=4;
 ctx.fillStyle='#5c397f';ctx.strokeStyle='#e6d0ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,26,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.strokeStyle='#ffffff';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-8,-8);ctx.lineTo(8,8);ctx.moveTo(8,-8);ctx.lineTo(-8,8);ctx.stroke();ctx.restore();
}
function draw(){
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,390,600);
 ctx.save();ctx.fillStyle=state.frenzy>0?'rgba(255,241,191,.38)':'rgba(255,250,241,.35)';ctx.fillRect(0,0,390,600);ctx.restore();

 for(const f of state.items)f.kind==='bomb'?bomb(f):fruit(f);
 for(const e of state.effects){ctx.save();ctx.globalAlpha=Math.min(1,e.life*3);if(e.kind==='half'){ctx.translate(e.x,e.y);ctx.rotate(e.angle);ctx.beginPath();ctx.rect(e.side<0?-32:0,-32,32,64);ctx.clip();ctx.fillStyle='#ffffff';ctx.font='51px "Apple Color Emoji","Segoe UI Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e.gold?'🍊':FRUITS[e.fruit].emoji,0,1);}else{ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();}ctx.restore();}
 for(let i=1;i<state.trail.length;i++){const a=state.trail[i-1],b=state.trail[i];if(a.stroke!==b.stroke)continue;ctx.globalAlpha=Math.min(a.life/.18,1);ctx.shadowColor='#ff9f1c';ctx.shadowBlur=12;ctx.strokeStyle='#f59b24';ctx.lineWidth=11;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.strokeStyle='#ffffff';ctx.lineWidth=4;ctx.stroke();}ctx.globalAlpha=1;ctx.shadowBlur=0;
 for(const l of state.labels){ctx.globalAlpha=Math.min(l.life*2,1);ctx.fillStyle=l.color;ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.strokeStyle='rgba(255,255,255,.92)';ctx.lineWidth=4;ctx.strokeText(l.text,Math.max(70,Math.min(320,l.x)),l.y);ctx.fillText(l.text,Math.max(70,Math.min(320,l.x)),l.y);}ctx.globalAlpha=1;
 const index=state.reaction==='cheer'||state.reaction==='party'?0:state.reaction==='happy'?2:1;
 const v=VARIANTS[index],img=portraits[v.asset];mctx.clearRect(0,0,180,180);if(img.complete&&img.naturalWidth){const [x,y,w,h]=v.box,scale=Math.min(170/w,170/h);mctx.filter=state.reaction==='oops'?'grayscale(1)':'none';mctx.drawImage(img,x,y,w,h,(180-w*scale)/2,180-h*scale,w*scale,h*scale);mctx.filter='none';}
}
function frame(t){let dt=Math.min((t-(last||t))/1000,.04);last=t;while(dt>0&&state.phase==='running'){const step=Math.min(dt,1/120);advance(state,step);dt-=step;}if(state.phase==='over'){pointer=null;lastPoint=null;}sync();draw();requestAnimationFrame(frame);}
function resize(){const d=Math.min(devicePixelRatio||1,2);cv.width=390*d;cv.height=600*d;ctx.setTransform(d,0,0,d,0,0);draw();}
window.addEventListener('resize',resize);resize();sync();requestAnimationFrame(frame);
