const GROUND=274,PLAYER_X=78,PLAYER_W=54,PLAYER_H=62,GRAVITY=1800,JUMP_SPEED=650;
function fresh(){return {phase:'ready',y:GROUND-PLAYER_H,vy:0,distance:0,fruit:0,score:0,speed:230,spawnIn:1.1,obstacles:[],oranges:[],time:0};}
function leap(s){if(s.phase!=='running')return false;if(s.y>=GROUND-PLAYER_H-.5&&s.vy===0){s.vy=-JUMP_SPEED;return true;}return false;}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function advance(s,dt,width,random=Math.random){
 if(s.phase!=='running')return;
 s.time+=dt;s.speed=Math.min(350,230+s.distance*.055);s.distance+=s.speed*dt/15;
 s.vy+=GRAVITY*dt;s.y+=s.vy*dt;
 if(s.y>GROUND-PLAYER_H){s.y=GROUND-PLAYER_H;s.vy=0;}
 s.spawnIn-=dt;
 if(s.spawnIn<=0){const h=34+random()*16,w=26+random()*12;s.obstacles.push({x:width+40,w,h});s.oranges.push({x:width+40+w/2,y:GROUND-100,taken:false});s.spawnIn=1.35+random()*.55;}
 const hit={x:PLAYER_X+10,y:s.y+8,w:PLAYER_W-20,h:PLAYER_H-13};
 for(const o of s.obstacles){o.x-=s.speed*dt;if(overlap(hit,{x:o.x+3,y:GROUND-o.h+3,w:o.w-6,h:o.h-3})){s.phase='over';}}
 for(const o of s.oranges){o.x-=s.speed*dt;if(!o.taken&&Math.hypot(PLAYER_X+PLAYER_W/2-o.x,s.y+PLAYER_H/2-o.y)<34){o.taken=true;s.fruit++;}}
 s.obstacles=s.obstacles.filter(o=>o.x+o.w>-30);s.oranges=s.oranges.filter(o=>o.x>-30&&!o.taken);
 s.score=Math.floor(s.distance)+s.fruit*20;
}

const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
const hero=new Image();hero.src=HERO;
let state=fresh(),best=0,W=720,last=0,carry=0;
try{best=Number(localStorage.getItem('lulu-jump-best-v1'))||0;}catch{}
$('best').textContent=best;
function resize(){W=Math.max(480,Math.round(canvas.getBoundingClientRect().width));const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=340*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
function saveBest(){if(state.score>best){best=state.score;try{localStorage.setItem('lulu-jump-best-v1',String(best));}catch{}$('best').textContent=best;}}
function update(){
 $('score').textContent=state.score;$('fruit').textContent=state.fruit;$('distance').textContent=Math.floor(state.distance);
 $('overlay').hidden=state.phase==='running';$('pause').disabled=state.phase==='ready'||state.phase==='over';$('pause').textContent=state.phase==='paused'?'继续':'暂停';
 if(state.phase==='ready'){$('title').textContent='和噜噜一起跳起来';$('subtitle').textContent='跳过障碍，吃到橘子 +20 分';$('start').textContent='开始游戏';}
 if(state.phase==='paused'){$('title').textContent='休息一下';$('subtitle').textContent='准备好了，就继续向前。';$('start').textContent='继续游戏';}
 if(state.phase==='over'){$('title').textContent='再跳远一点点！';$('subtitle').textContent=`这次 ${state.score} 分 · 跑了 ${Math.floor(state.distance)} 米`;$('start').textContent='再玩一局';saveBest();}
}
function action(){
 if(state.phase==='paused'){state.phase='running';last=performance.now();carry=0;update();return;}
 if(state.phase==='ready'||state.phase==='over'){state=fresh();state.phase='running';last=performance.now();carry=0;update();return;}
 leap(state);
}
function pause(){if(state.phase==='running'){state.phase='paused';carry=0;update();}else if(state.phase==='paused')action();}
$('start').onclick=action;$('jump').onclick=action;$('pause').onclick=pause;
canvas.addEventListener('pointerdown',e=>{e.preventDefault();action();});
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){if(e.target instanceof HTMLButtonElement&&e.code==='Space')return;e.preventDefault();if(!e.repeat)action();}if(e.code==='KeyP'&&!e.repeat)pause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.phase==='running')pause();});
function rounded(x,y,w,h,r,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();}
function draw(){
 ctx.clearRect(0,0,W,340);ctx.fillStyle='#fffaf1';ctx.fillRect(0,0,W,340);
 // Quiet distance markers make forward movement visible without busy scenery.
 ctx.strokeStyle='#ecdfca';ctx.lineWidth=1;
 for(let x=-(state.distance*5%110);x<W;x+=110){ctx.beginPath();ctx.moveTo(x,GROUND+26);ctx.lineTo(x+18,GROUND+26);ctx.stroke();}
 ctx.fillStyle='#f0dfc4';ctx.fillRect(0,GROUND,W,2);ctx.fillStyle='#fff4df';ctx.fillRect(0,GROUND+2,W,64);
 ctx.strokeStyle='#e3cba7';for(let x=-(state.distance*15%65);x<W;x+=65){ctx.beginPath();ctx.moveTo(x,GROUND+20);ctx.lineTo(x+10,GROUND+20);ctx.stroke();}
 for(const o of state.obstacles){rounded(o.x,GROUND-o.h,o.w,o.h,5,'#9aab93');rounded(o.x+4,GROUND-o.h+5,o.w-8,5,2,'#bdc9b4');}
 for(const o of state.oranges){ctx.font='27px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🍊',o.x,o.y);}
 const airborne=state.y<GROUND-PLAYER_H-.5;
 const cycle=[0,1,2,1];
 const frameIndex=airborne?3:state.phase==='running'?cycle[Math.floor(state.time*(9+state.speed/100))%4]:1;
 const bob=!airborne&&state.phase==='running'?Math.sin(state.time*24)*1.2:0;
 const lift=GROUND-PLAYER_H-state.y;
 ctx.fillStyle='#86624118';ctx.beginPath();ctx.ellipse(PLAYER_X+27,GROUND+3,Math.max(12,25-lift*.08),4,0,0,Math.PI*2);ctx.fill();
 if(hero.complete&&hero.naturalWidth){
  const [sx,sy,sw,sh]=SPRITE_FRAMES[frameIndex];
  const dh=76,dw=dh*sw/sh;
  ctx.drawImage(hero,sx,sy,sw,sh,PLAYER_X+PLAYER_W/2-dw/2,state.y+PLAYER_H-dh+bob,dw,dh);
 }

}
function frame(now){const elapsed=Math.min((now-(last||now))/1000,.05);last=now;if(state.phase==='running'){carry+=elapsed;while(carry>=1/120&&state.phase==='running'){advance(state,1/120,W);carry-=1/120;}if(state.phase==='over')carry=0;update();}draw();requestAnimationFrame(frame);}
window.addEventListener('resize',resize);hero.onload=draw;resize();update();requestAnimationFrame(frame);
</script></body></html>
